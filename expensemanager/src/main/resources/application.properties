spring.application.name=expensemanager

# Adres URL i sterownik
spring.datasource.url=jdbc:sqlite:exp.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# KLUCZE OBCE: Wymuszenie włączenia przy każdym otwarciu połączenia przez pulę Hikari
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON;

# Konfiguracja JPA / Hibernate dla SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logowanie i obsługa błędów
logging.level.org.hibernate.tool.schema=DEBUG
server.error.include-binding-errors=always